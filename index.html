<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>french number game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>French Number Game</h1>

        <label for="level">Choose Level:</label>
        <select  id="level">
            <option value="10">Easy(1 - 10)</option>
            <option value="20">Medium(1 - 40)</option>
            <option value="50">Hard(1 - 60)</option>
            <option value="100">Extra Hard(1 - 100)</option>
        </select>
        <button onclick="startGame()">Start Game</button>
        <div class="game-info">
            <p>Time: <span id="timer">60</span>s</p>
            <p>Score: <span id="score">0</span></p>
            <p>Questions: <span id="count">0</span>/10</p>
        </div>
        <div id="question">Press Start</div>

        <input type="number" id="answer" placeholder="enter answer">
        <button onclick="checkAnswer()">Submit</button>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
